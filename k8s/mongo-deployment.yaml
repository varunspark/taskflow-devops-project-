apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mongo-storage
          emptyDir: {}   # For real persistence, replace with a PersistentVolumeClaim
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: taskflow
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
