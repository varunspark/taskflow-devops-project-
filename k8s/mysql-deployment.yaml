apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: taskflow
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          emptyDir: {}   # For real persistence, replace with a PersistentVolumeClaim
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: taskflow
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
