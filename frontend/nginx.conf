server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, refreshing a page like /dashboard would 404,
    # because nginx would look for a literal file called "dashboard".
    # React Router handles routing client-side, so we always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have hashed filenames from the build)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
